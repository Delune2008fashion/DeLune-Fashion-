<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#520079"><title>Your Cart — DeLune</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css"><style>
.cart-wrap{max-width:1050px;margin:42px auto 90px;padding:0 5%;color:#fff}.cart-panel{background:linear-gradient(135deg,#520079,#71309A 58%,#390052);border:1px solid #a76bc0;padding:22px;margin:16px 0}.cart-row{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;border-bottom:1px solid #ffffff38;padding:14px 0}.cart-row img{width:100px;height:120px;object-fit:cover}.cart-row input,.cart-form input,.cart-form select,.cart-form textarea{width:100%;padding:11px;background:#310047;color:#fff;border:1px solid #d9bce7}.cart-form label{display:grid;gap:6px;margin:12px 0;font-size:12px}.cart-btn{padding:12px 18px;background:#310047;color:#fff;border:1px solid #fff;cursor:pointer;margin:5px}.cart-muted{opacity:.85;font-size:13px}.cart-total{display:flex;justify-content:space-between;padding:7px 0}.cart-whatsapp{color:#25D366!important;font-weight:700}@media(max-width:600px){.cart-row{grid-template-columns:72px 1fr}.cart-row img{width:72px;height:90px}.cart-row .cart-remove{grid-column:2}.cart-row input{max-width:90px}}
</style></head><body><header class="site-header"><a class="wordmark" href="/index.html"><img src="/logo.png" alt="DeLune" class="delune-logo"></a><a class="underlined-link" href="/categories.html">Continue shopping ↗</a></header>
<main class="cart-wrap"><p class="eyebrow">DELUNE · GUEST CART</p><h1 style="font:500 clamp(34px,6vw,52px) var(--serif)">Your shopping cart</h1><p class="cart-muted">No account or login required. Your cart is saved on this device.</p><section class="cart-panel"><div id="cartItems">Loading cart…</div><div id="cartTotals"></div></section><section class="cart-panel"><h2>Customer details</h2><form id="cartForm" class="cart-form"><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label><span class="cart-whatsapp">WhatsApp number</span><input name="phone" type="tel" required maxlength="25" placeholder="+880..." autocomplete="tel"></label><label>Delivery address<textarea name="address" required maxlength="500" rows="3"></textarea></label><label>District<select name="district" required><option value="">Select district</option></select></label><div id="paymentFields"><label>Payment method<select name="provider"><option value="bkash">bKash</option><option value="nagad">Nagad</option></select></label><p class="cart-muted">Send the delivery charge to the displayed merchant number, then enter your Transaction ID. Payment is manually verified.</p><p id="payNumbers"></p><label>Transaction ID<input name="transaction_id" maxlength="100" autocomplete="off"></label></div><div id="cartStatus" role="status" class="cart-muted"></div><button class="cart-btn" type="submit">Submit online order</button><button class="cart-btn" type="button" id="whatsappOrder">Order via WhatsApp</button></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/store.js"></script><script src="/cart.js?v=20261112-guest-cart-v1"></script></body></html>
