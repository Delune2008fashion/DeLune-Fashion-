<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Merchant Invitation — DeLune</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css"><style>.invite{max-width:440px;margin:65px auto;padding:24px;background:#fff;border:1px solid #e7e1d8}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:10px;text-transform:uppercase;color:#777}.field input{padding:12px;border:1px solid #ddd;font:inherit}.btn{width:100%;padding:13px;background:#191815;color:white;border:0;text-transform:uppercase;font-size:10px;letter-spacing:.1em}.status{font-size:13px;line-height:1.6}</style></head><body><header class="site-header"><a class="wordmark" href="/index.html"><img src="/logo.png" alt="DeLune" class="delune-logo"></a></header><main class="invite"><p class="eyebrow">MERCHANT INVITATION</p><h1 style="font:500 32px var(--serif)">Activate your account</h1><form id="form"><div class="field"><label>Your name</label><input id="name" required maxlength="100"></div><div class="field"><label>Email (must match invitation)</label><input id="email" type="email" required></div><div class="field"><label>Password (8+ characters)</label><input id="password" type="password" minlength="8" required></div><button class="btn">Activate account</button></form><p id="status" class="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/store.js"></script><script>document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const token=new URLSearchParams(location.search).get("token");const {data,error}=await DeLuneStore.client.functions.invoke("delune-api",{body:{action:"accept-invitation",token,email:document.querySelector("#email").value.trim(),password:document.querySelector("#password").value,display_name:document.querySelector("#name").value.trim()}});document.querySelector("#status").textContent=error?.message||data?.message||"Invitation activation failed.";if(data?.success)e.target.reset()}</script></body></html>
