<title>Page moved — DeLune</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4d1df;color:#242021;font:16px/1.6 Arial,sans-serif}.card{max-width:520px;padding:36px;background:#fff8fa;text-align:center}.card h1{font-family:Georgia,serif;font-weight:400}.card a{color:inherit}
</style>
<script>
(function(){
  var host=location.hostname.toLowerCase();
  var legacyHost=host==="fahad09belal.github.io";
  var path=location.pathname||"/";
  var prefix="/DeLune-Fashion-";
  if(legacyHost){
    if(path.toLowerCase().startsWith(prefix.toLowerCase()))path=path.slice(prefix.length);
    var legacyBase="https://delune2008fashion.github.io/DeLune-Fashion-";
    var product=path.match(/^\/products\/(.+?)(?:\/index\.html)?\/?$/i);
    if(product){location.replace(legacyBase+"/product.html?slug="+encodeURIComponent(product[1])+location.search+location.hash);return;}
    var routes={"/":"/index.html","/index":"/index.html","/categories":"/categories.html","/about":"/about.html","/contact":"/contact.html","/product":"/product.html","/moderate":"/moderate.html"};
    var clean=path.replace(/\/$/,"")||"/";
    var target=routes[clean.toLowerCase()]||clean;
    location.replace(legacyBase+target+location.search+location.hash);
    return;
  }
  var clean=path.replace(/\/$/,"")||"/";
  var product=clean.match(/^\/products\/(.+?)(?:\/index\.html)?$/i);
  if(product){location.replace("/product.html?slug="+encodeURIComponent(product[1])+location.search+location.hash);return;}
  var routes={"/":"/index.html","/index":"/index.html","/categories":"/categories.html","/about":"/about.html","/contact":"/contact.html","/product":"/product.html","/moderate":"/moderate.html"};
  var target=routes[clean.toLowerCase()];
  if(target){location.replace(target+location.search+location.hash);return;}
  if(clean.toLowerCase().endsWith(".html")){location.replace(clean+location.search+location.hash);return;}
})();
</script>
</head>
<body>
<main class="card">
<h1>That page has moved</h1>
<p>The page you requested could not be found. Return to the DeLune homepage.</p>
<p><a href="/">Continue to DeLune</a></p>
</main>
</body>
