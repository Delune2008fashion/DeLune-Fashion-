<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant Portal — DeLune</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css?v=20261112-purple"><style>
.portal{max-width:1080px;margin:45px auto 90px;padding:0 5%}.box{background:linear-gradient(135deg,#4b006d 0%,#7410a0 52%,#390052 100%);color:#fff;border:1px solid #8d42aa;padding:23px;margin-bottom:18px;box-shadow:0 12px 30px rgba(55,0,75,.12)}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff}.field input{padding:12px;border:1px solid #d9c5e3;background:#fff;color:#211329;font:inherit}.btn{border:0;background:#260038;color:#fff;padding:12px 15px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.btn.alt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.55)}.hidden{display:none!important}.muted{font-size:12px;line-height:1.6;color:rgba(255,255,255,.88)}.order{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.28);color:#fff;padding:17px;margin:12px 0}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{padding:5px 8px;background:rgba(255,255,255,.18);color:#fff;font-size:10px}.actions,.tracking{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tracking input{padding:10px;border:1px solid #d9c5e3;background:#fff;color:#211329;min-width:140px}.status{font-size:13px;margin-top:12px}.login{max-width:420px;margin:70px auto}@media(max-width:650px){.box{padding:17px}}

/* Merchant portal: royal-purple gradient cards with white, high-contrast text */
body{background:#A66BC2!important;color:#fff!important}
.portal,.portal *{color:#fff}
.portal .box,.portal .order{background:linear-gradient(135deg,#520079 0%,#71309A 58%,#8E4EAC 100%)!important;border:1px solid #C7A5D8!important;color:#fff!important;box-shadow:0 10px 28px rgba(49,0,71,.16)}
.portal .field label,.portal .muted,.portal .eyebrow,.portal .status{color:#fff!important;opacity:.94}
.portal .field input,.portal .tracking input{background:#310047!important;color:#fff!important;border:1px solid #D9BCE7!important}
.portal input::placeholder{color:#E9DDF0!important}
.portal .btn{background:linear-gradient(110deg,#A66BC2,#71309A)!important;color:#fff!important;border:1px solid #E9DDF0!important}
.portal .btn.alt{background:#310047!important;color:#fff!important;border:1px solid #E9DDF0!important}
.portal .tag{background:#310047!important;color:#fff!important;border:1px solid #C7A5D8}
.portal a{color:#fff!important}


/* Merchant dashboard layout refinement */
.portal{max-width:1120px!important;padding:32px 20px 76px!important;display:grid;gap:18px}
.portal>.box{border-radius:18px!important;padding:clamp(18px,3vw,28px)!important;margin:0!important}
.portal>.orderhead{background:#FBF8FD;border:1px solid #E2D5EA;border-radius:18px;padding:20px 24px;color:#310047!important;box-shadow:0 8px 24px rgba(49,0,71,.07)}
.portal>.orderhead *{color:#310047!important}
.portal>.orderhead .muted{color:#75627F!important}
.portal h1,.portal h2{line-height:1.2}
.portal .order{border-radius:13px!important;padding:18px!important;margin:12px 0!important;background:rgba(255,255,255,.10)!important}
.portal .order p{line-height:1.65;overflow-wrap:anywhere}
.portal .orderhead .tag{border-radius:999px;padding:6px 10px}
.portal .actions,.portal .tracking{align-items:center}
.portal .actions .btn,.portal .tracking .btn{min-height:42px;border-radius:8px}
.portal .tracking input{min-width:0;flex:1 1 150px;border-radius:8px}
.portal .btn{border-radius:8px;min-height:42px}
.portal .box>h2{margin-bottom:16px!important}
.portal #orders,.portal #queued{display:grid;gap:10px}
.portal .login{margin:35px auto!important;width:min(100%,460px)}
.portal .login form{display:grid;gap:12px}
.portal .login .field{margin:0}
.portal .login .btn{width:100%}
@media(max-width:650px){.portal{padding:22px 14px 55px!important}.portal>.orderhead{padding:17px;gap:12px}.portal>.orderhead h1{font-size:30px!important}.portal .actions .btn{flex:1 1 130px}.portal .tracking{display:grid;grid-template-columns:1fr 1fr}.portal .tracking input{width:100%;grid-column:span 1}.portal .tracking .btn{grid-column:1/-1}}

.order-filters{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0 20px}
.filter-btn{border:1px solid #eadcf2;background:#310047;color:#fff;padding:9px 13px;border-radius:7px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.filter-btn.active{background:#fff;color:#310047;border-color:#fff}
.message-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.message-tools .btn{font-size:10px}
.order-date{font-size:11px;opacity:.9}
@media(max-width:600px){.order-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.filter-btn{width:100%}}

/* Temporary diagnostics: expose JavaScript errors with source line and column. */
#merchantDebug{position:fixed;z-index:999999;left:10px;right:10px;bottom:10px;max-height:42vh;overflow:auto;background:#24002f;color:#fff;border:2px solid #ff6464;border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;display:none;box-shadow:0 8px 30px #0008}#merchantDebug strong{color:#ffb4b4}#merchantDebug button{float:right;background:#fff;color:#24002f;border:0;padding:5px 9px;border-radius:5px}
.order-product-image{display:block;width:100%;max-width:220px;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.35);margin:12px 0}</style></head><body><div id="merchantDebug" role="alert" aria-live="assertive"><button type="button" id="merchantDebugClose">Close</button><strong>MERCHANT PAGE ERROR</strong><div id="merchantDebugText"></div></div><script>
(()=>{const panel=()=>document.getElementById("merchantDebug"),out=()=>document.getElementById("merchantDebugText");function report(title,detail){const p=panel(),o=out();if(!p||!o){console.error(title,detail);return}p.style.display="block";o.textContent+="\\n\\n"+title+"\\n"+detail;console.error("[DeLune Merchant]",title,detail)}window.addEventListener("error",e=>{const target=e.target;if(target&&target!==window){report("RESOURCE ERROR",(target.src||target.href||target.tagName||"Unknown resource")+"\\nFailed to load");return}report("JAVASCRIPT ERROR",(e.message||"Unknown error")+"\\nFile: "+(e.filename||"unknown")+"\\nLine: "+(e.lineno??"unknown")+"\\nColumn: "+(e.colno??"unknown")+"\\nStack: "+(e.error?.stack||"not available"))},true);window.addEventListener("unhandledrejection",e=>{const r=e.reason;report("UNHANDLED PROMISE REJECTION",(r?.message||String(r))+"\\nStack: "+(r?.stack||"not available"))});document.addEventListener("DOMContentLoaded",()=>{document.getElementById("merchantDebugClose")?.addEventListener("click",()=>{panel().style.display="none"});const f=document.getElementById("loginForm");f?.addEventListener("submit",()=>{const s=document.getElementById("loginStatus");if(s&&!s.textContent)s.textContent="Login form submitted; waiting for authentication…"},true)});})();
</script><header class="site-header"><a class="wordmark" href="/index.html"><img src="/logo.png" alt="DeLune" class="delune-logo"></a><a class="underlined-link" href="/index.html">Back to store ↗</a></header><main class="portal"><section id="login" class="box login"><p class="eyebrow">RESTRICTED ACCESS</p><h1 style="font:500 34px var(--serif)">Merchant sign in</h1><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Sign in</button></form><p id="loginStatus" class="muted"></p></section><section id="dashboard" class="hidden"><div class="orderhead" style="align-items:center;margin-bottom:20px"><div><p class="eyebrow">ORDER OPERATIONS</p><h1 style="font:500 38px var(--serif);margin:0">Merchant dashboard</h1><p id="merchantName" class="muted"></p></div><button id="logout" class="btn alt">Sign out</button></div><div class="box"><div class="orderhead"><h2 style="font:500 24px var(--serif);margin:0">Orders</h2><button id="refresh" class="btn alt">Refresh</button></div><nav class="order-filters" aria-label="Filter orders"><button class="filter-btn active" data-filter="all">All</button><button class="filter-btn" data-filter="pending">Pending</button><button class="filter-btn" data-filter="confirmed">Confirmed</button><button class="filter-btn" data-filter="not_confirmed">Not confirmed</button></nav><div id="orders" class="muted">Loading…</div></div><div class="box"><h2 style="font:500 23px var(--serif);margin:0 0 12px">Messages to send later</h2><div id="queued" class="muted">Loading…</div></div><p id="dashStatus" class="status muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/store.js"></script><script src="/merchant.js?v=20261112-whatsapp-product-image-v6"></script></body></html>
