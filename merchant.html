<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant Portal — DeLune</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css?v=20261112-purple"><style>
.portal{max-width:1080px;margin:45px auto 90px;padding:0 5%}.box{background:linear-gradient(135deg,#4b006d 0%,#7410a0 52%,#390052 100%);color:#fff;border:1px solid #8d42aa;padding:23px;margin-bottom:18px;box-shadow:0 12px 30px rgba(55,0,75,.12)}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff}.field input{padding:12px;border:1px solid #d9c5e3;background:#fff;color:#211329;font:inherit}.btn{border:0;background:#260038;color:#fff;padding:12px 15px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.btn.alt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.55)}.hidden{display:none!important}.muted{font-size:12px;line-height:1.6;color:rgba(255,255,255,.88)}.order{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.28);color:#fff;padding:17px;margin:12px 0}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{padding:5px 8px;background:rgba(255,255,255,.18);color:#fff;font-size:10px}.actions,.tracking{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tracking input{padding:10px;border:1px solid #d9c5e3;background:#fff;color:#211329;min-width:140px}.status{font-size:13px;margin-top:12px}.login{max-width:420px;margin:70px auto}@media(max-width:650px){.box{padding:17px}}

/* Merchant portal: royal-purple gradient cards with white, high-contrast text */
body{background:#A66BC2!important;color:#fff!important}
.portal,.portal *{color:#fff}
.portal .box,.portal .order{background:linear-gradient(135deg,#520079 0%,#71309A 58%,#8E4EAC 100%)!important;border:1px solid #C7A5D8!important;color:#fff!important;box-shadow:0 10px 28px rgba(49,0,71,.16)}
.portal .field label,.portal .muted,.portal .eyebrow,.portal .status{color:#fff!important;opacity:.94}
.portal .field input,.portal .tracking input{background:#310047!important;color:#fff!important;border:1px solid #D9BCE7!important}
.portal input::placeholder{color:#E9DDF0!important}
.portal .btn{background:linear-gradient(110deg,#A66BC2,#71309A)!important;color:#fff!important;border:1px solid #E9DDF0!important}
.portal .btn.alt{background:#310047!important;color:#fff!important;border:1px solid #E9DDF0!important}
.portal .tag{background:#310047!important;color:#fff!important;border:1px solid #C7A5D8}
.portal a{color:#fff!important}

</style></head><body><header class="site-header"><a class="wordmark" href="/index.html"><img src="/logo.png" alt="DeLune" class="delune-logo"></a><a class="underlined-link" href="/index.html">Back to store ↗</a></header><main class="portal"><section id="login" class="box login"><p class="eyebrow">RESTRICTED ACCESS</p><h1 style="font:500 34px var(--serif)">Merchant sign in</h1><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Sign in</button></form><p id="loginStatus" class="muted"></p></section><section id="dashboard" class="hidden"><div class="orderhead" style="align-items:center;margin-bottom:20px"><div><p class="eyebrow">ORDER OPERATIONS</p><h1 style="font:500 38px var(--serif);margin:0">Merchant dashboard</h1><p id="merchantName" class="muted"></p></div><button id="logout" class="btn alt">Sign out</button></div><div class="box"><div class="orderhead"><h2 style="font:500 24px var(--serif);margin:0">Assigned orders</h2><button id="refresh" class="btn alt">Refresh</button></div><div id="orders" class="muted">Loading…</div></div><div class="box"><h2 style="font:500 23px var(--serif);margin:0 0 12px">Messages to send later</h2><div id="queued" class="muted">Loading…</div></div><p id="dashStatus" class="status muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/store.js"></script><script src="/merchant.js?v=20261112"></script></body></html>
