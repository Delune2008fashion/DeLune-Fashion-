<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant Portal — DeLune</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css?v=20261112-merchant"><style>
.portal{max-width:1080px;margin:45px auto 90px;padding:0 5%}.box{background:#fff;border:1px solid #e7e1d8;padding:23px;margin-bottom:18px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#777}.field input{padding:12px;border:1px solid #ddd;font:inherit}.btn{border:0;background:#191815;color:#fff;padding:12px 15px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.btn.alt{background:#fff;color:#191815;border:1px solid #ccc}.hidden{display:none!important}.muted{font-size:12px;line-height:1.6;color:#766f66}.order{border:1px solid #e8e2d8;padding:17px;margin:12px 0}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{padding:5px 8px;background:#f0ece5;font-size:10px}.actions,.tracking{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tracking input{padding:10px;border:1px solid #ddd;min-width:140px}.status{font-size:13px;margin-top:12px}.login{max-width:420px;margin:70px auto}@media(max-width:650px){.box{padding:17px}}
</style></head><body><header class="site-header"><a class="wordmark" href="/index.html"><img src="/logo.png" alt="DeLune" class="delune-logo"></a><a class="underlined-link" href="/index.html">Back to store ↗</a></header><main class="portal"><section id="login" class="box login"><p class="eyebrow">RESTRICTED ACCESS</p><h1 style="font:500 34px var(--serif)">Merchant sign in</h1><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Sign in</button></form><p id="loginStatus" class="muted"></p></section><section id="dashboard" class="hidden"><div class="orderhead" style="align-items:center;margin-bottom:20px"><div><p class="eyebrow">ORDER OPERATIONS</p><h1 style="font:500 38px var(--serif);margin:0">Merchant dashboard</h1><p id="merchantName" class="muted"></p></div><button id="logout" class="btn alt">Sign out</button></div><div class="box"><div class="orderhead"><h2 style="font:500 24px var(--serif);margin:0">Assigned orders</h2><button id="refresh" class="btn alt">Refresh</button></div><div id="orders" class="muted">Loading…</div></div><div class="box"><h2 style="font:500 23px var(--serif);margin:0 0 12px">Messages to send later</h2><div id="queued" class="muted">Loading…</div></div><p id="dashStatus" class="status muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/store.js"></script><script src="/merchant.js?v=20261112"></script></body></html>
