name: Generate product SEO pages
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "product.html"
      - "scripts/generate-seo-pages.mjs"
permissions:
  contents: write
concurrency:
  group: product-seo-pages
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate published product pages and sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-seo-pages.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A products sitemap.xml
          if git diff --cached --quiet; then
            echo "SEO pages are already up to date."
          else
            git commit -m "chore: refresh published product SEO pages"
            git push
          fi
